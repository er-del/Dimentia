name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (core + dev, CPU only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check dimendia
      - name: Black (check)
        run: black --check dimendia
      - name: Mypy
        run: mypy dimendia

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System deps (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install (core only, CPU)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: End-to-end smoke (synthetic clip, classical fallbacks)
        run: python -m dimendia.cli.convert selftest
